<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Justicia Cercana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: riel de navegación fijo a la izquierda + barra superior con estado de conexión + contenido con desplazamiento propio (tableta 10" horizontal, 1280×800) */
:root{
  --bg:#EAF0F4; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#14212C; --ink-2:#465663; --line:#D2DBE3; --line-strong:#9FB0BF;
  --primary:#164C70; --primary-hover:#0E3A57; --primary-soft:#E0ECF5; --on-primary:#FFFFFF;
  --rail:#0F2F48; --rail-ink:#D6E4EF; --rail-strong:#FFFFFF; --rail-soft:#1B425F;
  --ok:#1A6E42; --ok-soft:#DFF2E6; --warn:#8A4F00; --warn-soft:#FFF0CC; --bad:#B02318; --bad-soft:#FCE6E3; --info:#1B57A0; --info-soft:#E3EEFB; --neutral:#4E5B66; --neutral-soft:#E9EDF0;
  --c-aud:#5636B8; --c-aud-soft:#ECE7FB; --c-reu:#0A6F6D; --c-reu-soft:#DAF1F0; --c-vis:#944419; --c-vis-soft:#F8E8DD; --c-not:#1B57A0; --c-not-soft:#E3EEFB; --c-otr:#4E5B66; --c-otr-soft:#E9EDF0;
  --note:#D0215F; --note-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(15,47,72,.08), 0 4px 14px rgba(15,47,72,.06);
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C141B; --surface:#141F29; --surface-2:#1A2733; --ink:#E5EDF3; --ink-2:#A7B6C3; --line:#283948; --line-strong:#40566A;
  --primary:#86BFEA; --primary-hover:#A5D0F0; --primary-soft:#183248; --on-primary:#08192A;
  --rail:#08141E; --rail-ink:#B9CCDA; --rail-strong:#FFFFFF; --rail-soft:#15293A;
  --ok:#6BD197; --ok-soft:#133224; --warn:#F3BC57; --warn-soft:#35270C; --bad:#FF8C80; --bad-soft:#3A1714; --info:#94C0F4; --info-soft:#15283D; --neutral:#B2BEC8; --neutral-soft:#223140;
  --c-aud:#B7A4F5; --c-aud-soft:#2A2147; --c-reu:#6FD4D1; --c-reu-soft:#12302F; --c-vis:#F0A77E; --c-vis-soft:#3A2417; --c-not:#94C0F4; --c-not-soft:#15283D; --c-otr:#B2BEC8; --c-otr-soft:#223140;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0C141B; --surface:#141F29; --surface-2:#1A2733; --ink:#E5EDF3; --ink-2:#A7B6C3; --line:#283948; --line-strong:#40566A;
  --primary:#86BFEA; --primary-hover:#A5D0F0; --primary-soft:#183248; --on-primary:#08192A;
  --rail:#08141E; --rail-ink:#B9CCDA; --rail-strong:#FFFFFF; --rail-soft:#15293A;
  --ok:#6BD197; --ok-soft:#133224; --warn:#F3BC57; --warn-soft:#35270C; --bad:#FF8C80; --bad-soft:#3A1714; --info:#94C0F4; --info-soft:#15283D; --neutral:#B2BEC8; --neutral-soft:#223140;
  --c-aud:#B7A4F5; --c-aud-soft:#2A2147; --c-reu:#6FD4D1; --c-reu-soft:#12302F; --c-vis:#F0A77E; --c-vis-soft:#3A2417; --c-not:#94C0F4; --c-not-soft:#15283D; --c-otr:#B2BEC8; --c-otr-soft:#223140;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
.i{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell ---------- */
#app{height:100%}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;gap:6px;padding:16px 12px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 14px;color:var(--rail-strong)}
.brand .logo{width:44px;height:44px;border-radius:12px;background:var(--rail-strong);color:var(--rail);display:grid;place-items:center;flex:none}
.brand .logo .i{width:28px;height:28px}
.brand b{display:block;font-size:18px;line-height:1.1}
.brand small{display:block;font-size:13px;line-height:1.25;opacity:.85;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;border-radius:12px;border:0;background:none;color:var(--rail-ink);font-weight:700;font-size:17px;line-height:1.15;text-align:left;cursor:pointer;width:100%}
.nav button:hover{background:var(--rail-soft)}
.nav button.on{background:var(--rail-strong);color:var(--rail)}
.nav .count{margin-left:auto;min-width:30px;height:30px;display:grid;place-items:center;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:15px;padding:0 8px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:12px}
.who{display:flex;gap:10px;align-items:center;padding:0 6px;color:var(--rail-strong)}
.who b{display:block;font-size:15px;line-height:1.2}.who small{font-size:13px;opacity:.8}
.demo{border:2px dashed var(--rail-soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.demo p{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.switch{display:flex;align-items:center;gap:10px;min-height:44px;border:0;background:var(--rail-soft);border-radius:999px;padding:6px 14px 6px 6px;color:var(--rail-strong);font-weight:700;font-size:15px;cursor:pointer}
.switch .knob{width:44px;height:26px;border-radius:999px;background:var(--bad);position:relative;flex:none}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--rail-strong);transition:left .15s}
.switch.on .knob{background:var(--ok)}.switch.on .knob::after{left:21px}
.linkish{background:none;border:0;padding:6px 0;color:inherit;text-decoration:underline;cursor:pointer;font-size:14.5px;text-align:left}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:auto;position:relative;scroll-behavior:smooth}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 24px;min-height:78px}
.top .ttl{min-width:0}
.crumb{font-size:15px;color:var(--ink-2)}
.top h1{font-size:25px}
.pill{margin-left:auto;display:flex;align-items:center;gap:12px;min-height:58px;padding:6px 18px 6px 14px;border-radius:14px;border:2px solid;cursor:pointer;text-align:left;flex:none}
.pill .i{width:28px;height:28px}
.pill b{display:block;font-size:17px;line-height:1.2}.pill small{display:block;font-size:14.5px;line-height:1.25}
.pill.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pill.info{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.pill.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pill.neutral{background:var(--neutral-soft);border-color:var(--neutral);color:var(--neutral)}
.spin{animation:spin 1.1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.view{padding:20px 24px 28px;display:flex;flex-direction:column;gap:18px;flex:1}
.foot{position:sticky;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.foot .grow{margin-left:auto}

/* ---------- Common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:12px;justify-content:space-between}
.card h3{font-size:20px;display:flex;gap:10px;align-items:center}
.card h3 .n{background:var(--warn-soft);color:var(--warn);border-radius:999px;font-size:15px;padding:2px 10px}
.eyebrow{font-size:15px;color:var(--ink-2);font-weight:700;letter-spacing:.02em}
.muted{color:var(--ink-2)}
.lead{color:var(--ink-2);font-size:17.5px;max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:18px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.sm{min-height:48px;padding:0 16px;font-size:16.5px}
.btn.lg{min-height:64px;padding:0 28px;font-size:19px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.secondary{background:var(--surface);border-color:var(--line-strong);color:var(--primary)}
.btn.secondary:hover{background:var(--primary-soft)}
.btn.ghost{background:none;color:var(--ink-2);border-color:transparent;text-decoration:underline;padding:0 10px}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn:disabled{background:var(--neutral-soft);color:var(--neutral);border-color:var(--neutral-soft);cursor:not-allowed}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border-radius:999px;font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap}
.badge .i{width:18px;height:18px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.info{background:var(--info-soft);color:var(--info)}.badge.neutral{background:var(--neutral-soft);color:var(--neutral)}
.banner{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line)}
.banner p{flex:1}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.edit{background:var(--warn-soft);color:var(--warn);border:2px solid var(--warn);border-radius:14px}
.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:var(--primary);font-weight:700;cursor:pointer;min-height:48px;padding:0;align-self:flex-start}
.search{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line-strong);border-radius:14px;padding:0 16px;min-height:58px;flex:1;min-width:0}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:18px;height:54px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:16.5px;cursor:pointer;color:var(--ink)}
.fchip .c{background:var(--surface-2);border-radius:999px;padding:0 8px;font-size:14.5px}
.fchip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.fchip.on .c{background:var(--on-primary);color:var(--primary)}
.fchip .i{width:20px;height:20px}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* ---------- Home ---------- */
.hello{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hello > div:first-child{flex:1 1 320px}
.hello h2{font-size:28px}
.hello .search{flex:1 1 420px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.qa{display:flex;align-items:center;gap:14px;min-height:96px;padding:14px 18px;border-radius:16px;border:2px solid var(--primary);background:var(--primary);color:var(--on-primary);text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.qa:hover{background:var(--primary-hover)}
.qa .i{width:36px;height:36px}
.qa b{display:block;font-size:19px;line-height:1.2}.qa small{display:block;font-size:15px;opacity:.9;margin-top:2px}
.qa .plus{margin-left:auto;width:26px;height:26px}
.cols2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.arow{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:left;cursor:pointer}
.arow:hover{border-color:var(--primary)}
.arow-t{flex:1;min-width:0}.arow-t b{display:block;font-size:16.5px}.arow-t small{display:block;color:var(--ink-2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .chev{color:var(--ink-2)}
.syncsum{flex-direction:row;align-items:center;gap:16px}
.syncsum > .i{width:36px;height:36px;color:var(--warn)}
.syncsum.ok > .i{color:var(--ok)}
.syncsum p{flex:1}
.mini-act{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mini-act:last-child{border-bottom:0}
.mini-act .when{width:92px;flex:none;font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums}
.mini-act .when small{display:block;font-weight:400;color:var(--ink-2)}
.mini-act .what{flex:1;min-width:0}.mini-act .what b{display:block;font-size:16px;line-height:1.25}.mini-act .what small{display:block;font-size:14.5px}
.gres{display:flex;flex-direction:column;gap:6px}

/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 24px;gap:16px;align-items:center;width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.row:hover{border-color:var(--primary)}
.row-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15.5px;color:var(--ink-2)}
.code{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tipo{display:inline-flex;gap:6px;align-items:center}.tipo .i{width:20px;height:20px}
.row-parties{font-size:18px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.role{font-size:14px;font-weight:700;padding:2px 8px;border-radius:6px}
.role.sol{background:var(--primary-soft);color:var(--primary)}.role.inv{background:var(--c-vis-soft);color:var(--c-vis)}.role.tes{background:var(--neutral-soft);color:var(--neutral)}
.row-desc{color:var(--ink-2);font-size:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.row-side .next{font-size:15px;color:var(--ink-2)}
.empty{padding:30px;text-align:center;color:var(--ink-2)}

/* ---------- Detail ---------- */
.dhead{flex-direction:row;align-items:flex-start;gap:16px}
.big-ic{width:48px!important;height:48px!important;padding:10px;border-radius:14px;background:var(--primary-soft);color:var(--primary)}
.dhead .dh-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dhead h2{font-size:24px}
.dh-right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.dgrid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.dcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.parties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.party{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.party .pname{font-size:18px}
.party dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15.5px}
.party dt{color:var(--ink-2)}.party dd{margin:0}
.timeline{list-style:none;margin:0;padding:0 0 0 8px;display:flex;flex-direction:column}
.timeline li{position:relative;padding:0 0 16px 26px;border-left:3px solid var(--line)}
.timeline li:last-child{border-left-color:transparent;padding-bottom:4px}
.timeline li::before{content:"";position:absolute;left:-10px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--primary)}
.timeline li.last::before{background:var(--primary)}
.timeline time{font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums}
.timeline p{font-size:17px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:16.5px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0}
.editing{border:2px solid var(--warn)}
.changed{display:inline-flex;gap:6px;align-items:center;font-size:14.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:6px;margin-left:6px}
.inline-form{border:2px solid var(--primary);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--primary-soft)}
.doclist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.doclist li{display:flex;gap:10px;align-items:center;font-size:16px}

/* ---------- Forms ---------- */
.wiz{display:flex;flex-direction:column;gap:16px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps li > *{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;text-align:left}
.steps li button{cursor:pointer;color:var(--ok)}
.steps .sn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);border:2px solid var(--line-strong);font-size:16px}
.steps .sn .i{width:18px;height:18px}
.steps .done > *{border-color:var(--ok);background:var(--ok-soft)}
.steps .done .sn{background:var(--ok);border-color:var(--ok);color:var(--on-primary)}
.steps .cur > *{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.steps .cur .sn{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.steps .todo > *{color:var(--ink-2)}
.wiz-body{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.wiz-form{display:flex;flex-direction:column;gap:16px;min-width:0}
.wiz-form > h2{font-size:23px}
.wiz-aside{position:sticky;top:96px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;font-size:15.5px}
.wiz-aside h3{font-size:17px}
.wiz-aside ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.wiz-aside .sec{border-top:1px solid var(--line);padding-top:8px}
.wiz-aside .lbl2{color:var(--ink-2);font-size:14px;font-weight:700}
.fset{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px 18px 16px;margin:0;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);min-width:0}
.fset legend{font-weight:700;font-size:15px;color:var(--ink-2);padding:0 6px}
.fset-h{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.prow{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-start}
.prow > .field{flex:1 1 190px}.prow > .field.doc{flex:0 0 auto}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-weight:700;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.req,.opt{font-style:normal;font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.req{background:var(--primary-soft);color:var(--primary)}
.opt{color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line)}
.inp{width:100%;min-height:54px;padding:10px 14px;border:2px solid var(--line-strong);border-radius:12px;background:var(--surface);font-size:18px}
textarea.inp{min-height:96px;resize:vertical;line-height:1.4}
.inp:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.has-err .inp{border-color:var(--bad);background:var(--bad-soft)}
.help{font-size:14.5px;color:var(--ink-2)}
.err{font-size:15px;color:var(--bad);font-weight:700;display:flex;gap:6px;align-items:center;min-height:0}
.err:empty{display:none}
.err .i{width:18px;height:18px}
.counter{font-size:14px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 16px;border:2px solid var(--line-strong);border-radius:12px;background:var(--surface);font-weight:700;font-size:16.5px;cursor:pointer}
.seg label.on{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.seg label .i{width:20px;height:20px}
.seg input,.tiles input{position:absolute;opacity:0;pointer-events:none}
.seg label:focus-within,.tile:focus-within{outline:3px solid var(--primary);outline-offset:2px}
.seg.desc label{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;padding:8px 16px;flex:1 1 180px}
.seg.desc label small{font-weight:400;font-size:14.5px;opacity:.9}
.seg.desc label span{display:flex;gap:8px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;min-height:118px;border:2px solid var(--line-strong);border-radius:14px;background:var(--surface);cursor:pointer}
.tile .ti{width:32px;height:32px;color:var(--primary)}
.tile b{font-size:17px;line-height:1.2}
.tile small{font-size:14.5px;color:var(--ink-2);line-height:1.3}
.tile.on{border:3px solid var(--primary);background:var(--primary-soft);padding:13px}
.tile .tick{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.tile .tick .i{width:18px;height:18px}
.tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.tiles.five .tile{min-height:92px;align-items:center;text-align:center;justify-content:center}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:2px solid}
.alert > .i{width:28px;height:28px;margin-top:1px}
.alert .body{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.alert .acts{display:flex;gap:10px;flex-wrap:wrap}
.alert.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}.alert.warn > .i{color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}.alert.bad > .i{color:var(--bad)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)}.alert.ok > .i{color:var(--ok)}
.alert.info{background:var(--info-soft);border-color:var(--info)}.alert.info > .i{color:var(--info)}
.alert ul{margin:0;padding-left:20px}
.alert a{color:var(--bad);font-weight:700}
.check{display:flex;gap:12px;align-items:center;min-height:52px;font-weight:700;cursor:pointer}
.check input{width:26px;height:26px;accent-color:var(--primary)}
.reqlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.reqlist li{display:flex;gap:8px;align-items:flex-start;font-size:16px;background:var(--surface);border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.reqlist .i{color:var(--ok);width:22px;height:22px}
.review{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.review .card h3{justify-content:space-between}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.quickdates{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Confirmation ---------- */
.confirm{max-width:760px;margin:10px auto;align-items:center;text-align:center;gap:14px;padding:30px}
.confirm .bigok{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.confirm .bigok .i{width:52px;height:52px;stroke-width:2.5}
.confirm h2{font-size:30px}
.confirm .codebig{font-size:34px;font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;background:var(--surface-2);border:2px dashed var(--line-strong);border-radius:12px;padding:6px 18px}
.confirm .acts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ---------- Agenda ---------- */
.ag{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(290px,1fr);gap:18px;align-items:start}
.cal-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-h h2{font-size:23px;min-width:210px;text-align:center}
.iconbtn{width:52px;height:52px;display:grid;place-items:center;border-radius:12px;border:2px solid var(--line-strong);background:var(--surface);cursor:pointer;color:var(--primary)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-size:14px;font-weight:700;color:var(--ink-2);text-align:center;padding:4px 0;text-transform:capitalize}
.day{min-height:92px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;min-width:0}
.day.out{background:var(--surface-2);opacity:.55}
.day .dn{font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px;padding:1px 3px}
.day.today .dn span{background:var(--primary);color:var(--on-primary);border-radius:999px;padding:0 7px}
.day.today .dn em{font-style:normal;font-size:12.5px;color:var(--primary)}
.day.sel{border:3px solid var(--primary);padding:2px}
.chip{display:flex;align-items:center;gap:3px;border-radius:6px;padding:1px 3px;font-size:12.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;min-width:0}
.chip .i{width:14px;height:14px;stroke-width:2.4}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip.cx span{text-decoration:line-through}
.chip.done{opacity:.62}
.chip.more{color:var(--ink-2);font-weight:700}
.c-aud{background:var(--c-aud-soft);color:var(--c-aud)}.c-reu{background:var(--c-reu-soft);color:var(--c-reu)}.c-vis{background:var(--c-vis-soft);color:var(--c-vis)}.c-not{background:var(--c-not-soft);color:var(--c-not)}.c-otr{background:var(--c-otr-soft);color:var(--c-otr)}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:14.5px}
.legend .chip{font-size:14px;padding:3px 8px}
.act{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}.act .t small{display:block;color:var(--ink-2);font-weight:400;font-size:15px}
.act .b{display:flex;flex-direction:column;gap:6px;min-width:0}
.act .b > b{font-size:17.5px;line-height:1.25}
.act .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.act .place{display:flex;gap:6px;align-items:center;color:var(--ink-2);font-size:15.5px}
.act .place .i{width:18px;height:18px}
.act.new{background:var(--ok-soft);border-radius:12px;padding:12px 10px}
.act.cancel .b > b{text-decoration:line-through;color:var(--ink-2)}
.act .acts{display:flex;gap:8px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 10px 3px 8px;font-size:15px;font-weight:700}
.cat .i{width:18px;height:18px}
.upcoming{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:16px}

/* ---------- Sync ---------- */
.sgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.shero{flex-direction:row;gap:18px;align-items:flex-start;padding:22px}
.shero > .i{width:56px;height:56px;padding:12px;border-radius:16px;flex:none}
.shero.warn > .i{background:var(--warn-soft);color:var(--warn)}.shero.ok > .i{background:var(--ok-soft);color:var(--ok)}.shero.info > .i{background:var(--info-soft);color:var(--info)}.shero.bad > .i{background:var(--bad-soft);color:var(--bad)}
.shero.warn{border:2px solid var(--warn)}.shero.ok{border:2px solid var(--ok)}.shero.info{border:2px solid var(--info)}
.shero .body{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.shero h2{font-size:25px}
.steps-how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.bar{height:16px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--info);transition:width .3s}
.shero.ok .bar span{background:var(--ok)}.shero.warn .bar span{background:var(--warn)}
.pctbig{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--info)}
.pctbig span{font-size:28px;margin-left:4px}
.shero.ok .pctbig{color:var(--ok)}.shero.warn .pctbig{color:var(--warn)}
.banner .bar.mini{width:180px;height:12px;flex:none}
.pctsm{font-size:20px;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.olist li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.olist li .t{flex:1;min-width:0}.olist li .t b{display:block;font-size:16.5px}.olist li .t small{color:var(--ink-2);font-size:14.5px}
.reason{font-size:15px;color:var(--ink-2)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:calc(220px + (100% - 220px)/2);transform:translateX(-50%);bottom:104px;z-index:60;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--surface);padding:12px 12px 12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(760px,calc(100% - 260px))}
.toast .i{color:var(--ok-soft)}
.toast p{flex:1}
.toast button{min-height:48px;padding:0 16px;border-radius:10px;border:2px solid var(--surface);background:none;color:var(--surface);font-weight:700;cursor:pointer}

/* ---------- Anotaciones para el informe ---------- */
.nmark{position:absolute;top:-13px;right:-11px;z-index:80;background:var(--note);color:var(--note-ink);font:700 14px/1 var(--font);padding:5px 7px;border-radius:999px;border:2px solid var(--note-ink);box-shadow:0 2px 6px rgba(0,0,0,.35);pointer-events:none;letter-spacing:.02em}
.n-on{outline:3px dashed var(--note)!important;outline-offset:3px}

/* ---------- Computadora ---------- */
@media (min-width:1400px){ .view{max-width:1240px;width:100%;margin:0 auto} .shell{grid-template-columns:240px minmax(0,1fr)} .toast{left:calc(240px + (100% - 240px)/2)} }
/* ---------- Pantallas pequeñas ---------- */
@media (max-width:860px){
  .shell{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .rail{order:2;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:4px}
  .brand,.rail-foot .who{display:none}
  .nav{flex-direction:row;flex:1}
  .nav button{flex-direction:column;gap:2px;font-size:12px;min-height:56px;padding:4px;justify-content:center;text-align:center}
  .nav button span:not(.count){display:none}.nav button .count{margin:0}
  .rail-foot{margin:0;padding:0}.demo{padding:4px;border-width:1px}.demo p,.demo .linkish{display:none}.switch{font-size:12px;padding:4px 8px 4px 4px}
  .top{flex-wrap:wrap;padding:8px 16px}.pill{margin-left:0;width:100%}
  .view{padding:16px}
  .quick,.cols2,.dgrid,.wiz-body,.ag,.sgrid,.review,.g2,.g3,.parties,.reqlist{grid-template-columns:minmax(0,1fr)}
  .tiles,.tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(4,minmax(0,1fr))}.steps .sl{display:none}
  .wiz-aside{display:none}
  .row{grid-template-columns:minmax(0,1fr)}.row-side{align-items:flex-start}.row > .i{display:none}
  .day{min-height:58px}.chip span{display:none}
  .toast{left:50%;max-width:calc(100% - 32px);bottom:90px}
}
</style>

/* ----- Casos ----- */
function casosFiltrados(){
  const f = ui.filtro.casos, q = norm(ui.q.casos);
  return db.casos.filter(c => {
    if(f==='atencion' && !atencionCaso(c)) return false;
    if(['tramite','concluido','derivado'].includes(f) && c.estado!==f) return false;
    if(!q) return true;
    return norm(c.codigo).includes(q) || norm(c.desc).includes(q) || norm(tipoCaso(c.tipo).label).includes(q) || c.partes.some(x=>{ const p = P(x.pid); return norm(nombre(p)).includes(q) || (p.docNum||'').includes(q); });
  });
}
function casoRow(c){

    <div><div class="row-top"><span class="code">${c.codigo}</span><span class="tipo">${icon(t.icon)}${t.label}</span><span>· ${fmt(c.fecha)}</span></div>

}

function newPersona(rol){ return {rol, nombres:'', apellidos:'', docTipo:'DNI', docNum:'', tel:'', comunidad:'', dir:'', idioma:'', pid:null, dupNo:false}; }
function newDraft(kind){
  if(kind==='caso') return {personas:[newPersona('Solicitante'), newPersona('Invitado')], fecha:TODAY_ISO, tipo:'', tipoOtro:'', desc:'', estado:'tramite', obs:'', resultado:'', cita:'', citaFecha:'', citaHora:'09:00', citaLugar:'Juzgado de paz', docs:[], docRef:'', savedAt:null};
  return {tipo:'', tipoOtro:'', personas:[newPersona('Solicitante')], fechaSol:TODAY_ISO, fechaAt:'', asunto:'', estado:'pendiente', obs:'', resultado:'', fechaEntrega:'', docs:[], libro:'', folio:'', dupActOk:false, savedAt:null};
}
const hasContent = d => d && (d.personas.some(p=>p.nombres||p.apellidos||p.docNum) || d.tipo || d.desc || d.asunto);
function findDup(p){
  if(p.pid || p.dupNo) return null;
  if(p.docTipo==='DNI' && /^\d{8}$/.test(p.docNum)){ const x = db.personas.find(z=>z.docNum===p.docNum); if(x) return x; }
  const full = norm(p.nombres+' '+p.apellidos);
  if(p.nombres && p.apellidos.length>3) return db.personas.find(z=>norm(nombre(z))===full) || null;
  return null;
}
function dupHtml(kind,i){

  if(!x) return '';
  return `<div class="alert warn" data-n="D9">${icon('info')}<div class="body"><p><b>Esta persona ya está registrada:</b> ${esc(nombre(x))} · ${x.docTipo==='DNI'?'DNI '+x.docNum:'sin documento'} · ${esc(x.comunidad)}. Aparece en ${apariciones(x.id)}.</p>

function dupActuacion(){

  const pid = sol.pid || (findDup(sol)||{}).id || (sol.docNum && (db.personas.find(z=>z.docNum===sol.docNum)||{}).id);
  if(!pid) return null;
  return db.actuaciones.find(a => a.tipo===d.tipo && a.personas.some(x=>x.pid===pid && x.rol==='Solicitante') && -diffDays(a.fechaSol) <= 90) || null;
}

const plusHour = t => { const [h,m] = t.split(':').map(Number); return `${pad(Math.min(h+1,23))}:${pad(m)}`; };
const finDe = a => a.fin && a.fin > a.inicio ? a.fin : plusHour(a.inicio);
function conflicto(d){
  if(d.todoDia || !d.inicio) return null; const fin = finDe(d);
  return db.actividades.find(a => a.fecha===d.fecha && a.estado!=='cancelada' && a.inicio && a.inicio < fin && finDe(a) > d.inicio) || null;
}

  if(s.status==='running'){
    hero = `<section class="card shero info" data-n="D29b">${icon('sync','spin')}<div class="body"><h2>Enviando sus cambios automáticamente</h2>${bar(pct)}<p>${s.done} de ${s.total} cambios enviados. No apague la tableta. No tiene que tocar nada.</p></div></section>`; }
  else if(s.status==='done'){
    hero = `<section class="card shero ok" data-n="D29c">${icon('check-circle')}<div class="body"><h2>Sincronización completa</h2>${bar(100)}<p>Se enviaron <b>${s.done} de ${s.total}</b> cambios. Ya están guardados también en el servidor.</p>
      <dl class="kv"><dt>Fecha y hora</dt><dd>${fmtDT(db.lastSync)}</dd><dt>Constancia</dt><dd><b>${s.receipt}</b></dd></dl>
      <p class="help">${icon('monitor')} Desde ahora también puede ver esta información en una computadora con Internet.</p><div><button class="btn primary" data-act="syncClose">${icon('home')}Volver al inicio</button></div></div></section>`; }
  else if(s.status==='partial'){
    hero = `<section class="card shero warn" data-n="D29d">${icon('alert')}<div class="body"><h2>Se cortó la conexión durante el envío</h2>${bar(pct)}<p>Se enviaron ${s.done} de ${s.total} cambios. <b>Lo que falta no se perdió:</b> sigue guardado en esta tableta y se enviará solo cuando vuelva Internet.</p></div></section>`; }
  else if(!db.online){
    hero = `<section class="card shero warn" data-n="D29">${icon('wifi-off')}<div class="body"><h2>No hay Internet en este momento</h2><p>Puede seguir trabajando. <b>Todo lo que registra se guarda en esta tableta</b> y no se pierde aunque la apague.</p>
      <p><b>¿Cómo se envían sus cambios?</b></p><ol class="steps-how"><li>Lleve la tableta a la sede judicial o conéctela al Wi-Fi de su comunidad.</li><li>Apenas haya Internet, el envío empieza solo. Verá el avance de 0 a 100 %.</li><li>Al llegar a 100 % verá «Sincronización completa».</li></ol></div></section>`; }
  else if(n){ hero = `<section class="card shero info">${icon('wifi')}<div class="body"><h2>Hay Internet: el envío empieza en un momento</h2>${bar(0)}<p>Tiene ${n} ${plural(n,'cambio','cambios')} en la tableta. Se enviarán automáticamente.</p></div></section>`; }
  else { hero = `<section class="card shero ok">${icon('cloud-check')}<div class="body"><h2>Todo está sincronizado</h2>${bar(100)}<p>No hay cambios pendientes. Última sincronización: ${fmtDT(db.lastSync)}.</p></div></section>`; }
  const stIcon = st => st==='ok' ? `<span class="badge ok">${icon('check')}Enviado</span>` : st==='sending' ? `<span class="badge info">${icon('sync','spin')}Enviando</span>` : `<span class="badge warn">${icon('tablet')}En la tableta</span>`;
  const totals = `${db.casos.length} casos, ${db.actuaciones.length} actuaciones y ${db.actividades.length} actividades`;
  return { title:'Sincronización', crumb:'Envío automático de lo guardado en la tableta', html:`
  <div class="sgrid"><div class="dcol">${hero}
    <section class="card" data-n="D28c"><h3>${icon('tablet')}${s.status==='idle'?`Cambios que faltan enviar (${n})`:'Cambios de este envío'}</h3>
      ${items.length?`<ul class="olist">${items.map(o=>`<li>${icon(icons[o.tipo])}<span class="t"><b>${esc(o.etiqueta)}</b><small>${o.accion==='Nuevo'?'Registro nuevo':'Cambio'} · guardado ${o.at.slice(0,10)===TODAY_ISO?'hoy':'el '+fmt(o.at.slice(0,10))} a las ${o.at.slice(11,16)}</small></span>${stIcon(o.st)}</li>`).join('')}</ul>`:'<p class="muted">No hay nada pendiente.</p>'}</section></div>
  <div class="dcol">
    <section class="card"><h3>${icon('clock')}Última sincronización</h3><p><b>${fmtDT(db.lastSync)}</b></p><p class="muted">Si pasa muchos días sin Internet, lleve la tableta a la sede judicial: el envío empezará solo.</p></section>
    <section class="card"><h3>${icon('shield-check')}En esta tableta</h3><p>${totals}. Se guardan cifrados y protegidos con su clave.</p></section>
    <section class="card" data-n="D31"><h3>${icon('monitor')}Desde una computadora</h3><p>Si su comunidad tiene Internet, entre a la misma dirección web con su usuario. Verá lo último que sincronizó y podrá registrar con teclado y ratón.</p></section>
  </div></div>` };
}
/* Envío automático: empieza solo cuando hay Internet y cambios en la tableta */
const syncPct = () => ui.sync.total ? Math.round(100*ui.sync.done/ui.sync.total) : 0;
let syncTimer = null;
function scheduleSync(ms=800){ clearTimeout(syncTimer); syncTimer = setTimeout(startSync, ms); }
function refreshSyncUI(){
  const typing = document.activeElement && document.activeElement.matches('input,textarea,select');
  const hasForm = ['casoNuevo','notNueva','actNueva'].includes(ui.route) || ui.edit || ui.avance || typing;
  if(!hasForm) return render();
  const p = document.querySelector('.pill'); if(p) p.outerHTML = statusPill();
  const b = document.getElementById('sync-banner'); if(b) b.innerHTML = syncBanner();
  const r = document.querySelector('.rail'); if(r) r.outerHTML = rail();
  if(ui.notes) applyNotes(ui.notes);
}
function startSync(){
  if(!db.online || !db.outbox.length || ui.sync.status==='running') return;
  const items = db.outbox.map(o=>({...o, st:'wait'}));
  ui.sync = {status:'running', done:0, total:items.length, items};
  refreshSyncUI(); let k = 0;
  const tick = () => {
    if(!db.online) return finish();
    const it = items[k]; it.st = 'sending'; refreshSyncUI();
    setTimeout(() => {
      it.st = 'ok'; ui.sync.done++; markSynced(it);
      k++; if(k<items.length){ refreshSyncUI(); setTimeout(tick, 250); } else finish();
    }, 650);
  };
  function finish(){
    if(ui.sync.done) db.lastSync = nowISO();
    const complete = ui.sync.done===ui.sync.total;
    ui.sync.status = complete ? 'done' : 'partial';
    ui.sync.receipt = `SYNC-${db.lastSync.replace(/[-:T]/g,'').slice(0,12)}`;
    persist(); refreshSyncUI();
    if(complete && ui.route!=='sincronizar') toast(`<b>Sincronización completa: 100 %.</b> Se enviaron ${ui.sync.total} ${plural(ui.sync.total,'cambio','cambios')}.`, {icon:'cloud-check', ms:5000});
    if(db.online && db.outbox.length) scheduleSync(1200);
  }
  setTimeout(tick, 300);
}
function syncBanner(){
  if(ui.sync.status!=='running' || ui.route==='sincronizar') return '';
  const p = syncPct();
  return `<div class="banner info" data-n="D30">${icon('sync','spin')}<p><b>Hay Internet: enviando sus cambios automáticamente.</b> ${ui.sync.done} de ${ui.sync.total} enviados.</p><div class="bar mini" aria-hidden="true"><span style="width:${p}%"></span></div><b class="pctsm">${p} %</b></div>`;
}
function undoQueue(tipo, rec, hadOut, prevSync, etiqueta){
  const still = db.outbox.some(o=>o.ref===rec.id);
  if(still && !hadOut){ db.outbox = db.outbox.filter(o=>o.ref!==rec.id); rec.sync = prevSync; }
  else if(!still) queue(tipo, rec, 'Cambio', etiqueta);
}
function markSynced(it){
  db.outbox = db.outbox.filter(o=>o.id!==it.id);
  const col = it.tipo==='caso' ? db.casos : it.tipo==='actuacion' ? db.actuaciones : db.actividades;
  const r = col.find(x=>x.id===it.ref); if(r && !db.outbox.some(o=>o.ref===r.id)) r.sync='ok';
  persist();
}
function queue(tipo, rec, accion, etiqueta){
  rec.sync = 'pendiente';
  const ex = db.outbox.find(o=>o.ref===rec.id);
  if(ex){ ex.at = nowISO(); if(ex.accion!=='Nuevo') ex.accion = accion; ex.etiqueta = etiqueta; }
  else db.outbox.push({id:'o'+Date.now()+Math.random().toString(36).slice(2,6), tipo, ref:rec.id, accion, etiqueta, at:nowISO()});
  if(db.online) scheduleSync(900);
}

/* =============== Enlaces de datos =============== */
function getPath(path){ return path.split('.').reduce((o,k)=>o==null?o:o[k], path.startsWith('edit.')||path.startsWith('avance.') ? ui : db); }
function setPath(path, val){

function touchDraft(path){
  const m = path.match(/^drafts\.(\w+)/); if(!m) return;
  const d = db.drafts[m[1]]; d.savedAt = nowISO(); persist();

const RULES = {
  req: (v,el) => v ? '' : `Falta escribir ${el.dataset.what}.`,
  nombre: v => !v || /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' .-]{2,}$/.test(v) ? '' : 'Use solo letras, sin números ni símbolos.',
  dni: v => !v || /^\d{8}$/.test(v) ? '' : `El DNI tiene 8 números. Escribió ${v.replace(/\D/g,'').length}${/\D/.test(v)?' y otros signos':''}.`,
  tel: v => !v || /^9\d{8}$/.test(v) ? '' : 'El celular tiene 9 números y empieza con 9.',
  nofuture: v => !v || v <= TODAY_ISO ? '' : 'Esta fecha no puede ser después de hoy.',
  nopast: v => !v || v >= TODAY_ISO ? '' : 'Elija hoy o una fecha próxima.',
  min10: v => !v || v.length>=10 ? '' : 'Escriba un poco más (al menos 10 letras).',
  afterSol: v => { const s = db.drafts.not && db.drafts.not.fechaSol; return !v || !s || v>=s ? (v && v>TODAY_ISO ? 'Esta fecha no puede ser después de hoy.' : '') : 'La atención no puede ser antes del pedido.'; },
  afterIni: v => { const d = db.drafts.act; return !v || !d || v > d.inicio ? '' : 'La hora de término debe ser después de la hora de inicio.'; },
};
function validateField(el){
  if(!el.dataset.rule) return '';
  const v = (el.value||'').trim(); let msg = '';
  for(const r of el.dataset.rule.split(' ')){ msg = RULES[r](v, el); if(msg) break; }
  if(msg) ui.errors[el.id] = msg; else delete ui.errors[el.id];
  const e = document.getElementById('e-'+el.id), f = document.getElementById('f-'+el.id);
  if(e) e.innerHTML = msg ? icon('alert')+esc(msg) : '';
  if(f) f.classList.toggle('has-err', !!msg);
  el.setAttribute('aria-invalid', msg ? 'true' : 'false');
  return msg;
}
function validateStep(kind, paso){
  const errs = [];
  document.querySelectorAll('.wiz-form [data-rule]').forEach(el => { const m = validateField(el); if(m) errs.push({id:el.id, msg:`${el.dataset.ctx}: ${m}`}); });
  const d = db.drafts[kind];
  if(kind==='caso' && paso===1 && !d.personas.some(p=>p.rol==='Solicitante')) errs.unshift({id:'pcard-0', msg:'Debe haber al menos una persona con el rol «Solicitante».'});
  if(kind==='caso' && paso===2 && !d.tipo){ ui.errors['g-tipo'] = 'Elija una opción.'; errs.unshift({id:'f-g-tipo', msg:'Tipo de conflicto: elija una opción.'}); }

  if(kind==='not' && paso===2){ if(!d.personas.some(p=>p.rol==='Solicitante')) errs.unshift({id:'pcard-0', msg:'Debe haber al menos una persona con el rol «Solicitante».'}); if(dupActuacion() && !d.dupActOk) errs.unshift({id:'dupact', msg:'Confirme si es un trámite nuevo o si ya existe.'}); }
  return errs;
}

function upsertPersona(p){

  const id = 'p'+Date.now()+Math.random().toString(36).slice(2,5);
  db.personas.push({id, nombres:p.nombres.trim(), apellidos:p.apellidos.trim(), docTipo:p.docTipo, docNum:p.docTipo==='No tiene'?'':p.docNum.trim(), tel:p.tel, comunidad:p.comunidad.trim(), dir:p.dir, idioma:p.idioma});
  return id;
}

function saveNot(){

function startWizard(kind, fresh){

  editCaso: (_,el) => { const c = casoById(el.dataset.id); const o = {estado:c.estado, desc:c.desc, obs:c.obs, resultado:c.resultado}; ui.edit = {kind:'caso', id:c.id, orig:{...o}, draft:{...o}}; render(); },

  const el = e.target;
  if(el.dataset.q){ ui.q[el.dataset.q] = el.value; const box = document.getElementById(el.dataset.q==='casos'?'list-casos':'list-not'); if(box) box.innerHTML = el.dataset.q==='casos' ? listCasos() : listNot(); if(ui.notes) applyNotes(ui.notes); return; }
  if(!el.dataset.bind) return;

  if(el.inputMode==='numeric' && /docNum|tel|libro|folio/.test(el.dataset.bind)){ const clean = v.replace(/\D/g,''); if(clean!==v && /tel/.test(el.dataset.bind)){ v = clean; el.value = v; } }
  setPath(el.dataset.bind, v); touchDraft(el.dataset.bind);
  if(el.dataset.bind==='drafts.act.titulo') db.drafts.act.tituloAuto = false;
  const cnt = document.getElementById('cnt-'+el.id); if(cnt) cnt.textContent = `${v.length} / ${el.maxLength}`;
  if(ui.errors[el.id]) validateField(el);
  const m = el.dataset.bind.match(/^drafts\.(caso|not)\.personas\.(\d+)\.(docNum|nombres|apellidos)$/);
  if(m){ const box = document.getElementById('dup-'+m[2]); if(box && (m[3]==='docNum' ? v.length===8 || box.innerHTML : true)) box.innerHTML = dupHtml(m[1], +m[2]); }
  const ed = el.dataset.bind.match(/^edit\.draft\.(\w+)$/);
  if(ed){ const k = ed[1], o = ui.edit.orig[k], span = document.getElementById('ch-'+k); if(span){ span.className = v!==o ? 'changed' : ''; span.innerHTML = v!==o ? `${icon('edit')}Modificado · antes: «${esc(o||'vacío').slice(0,40)}»` : ''; } }
});
app.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset.actFile){ const f = el.files && el.files[0]; if(!f) return; const k = el.dataset.actFile;
    if(k==='caso'){ const c = casoById(el.dataset.id); c.docs.push({nombre:f.name}); queue('caso', c, 'Cambio', `Caso ${c.codigo} · documento nuevo`); persist(); render(); toast(`<b>${esc(f.name)}</b> se guardó en la tableta.`); }
    else { const kind = k==='draft-caso'?'caso':'not'; db.drafts[kind].docs.push({nombre:f.name}); touchDraft(`drafts.${kind}`); render(); }
    return; }

function applyNotes(list){
  document.querySelectorAll('.nmark').forEach(n=>n.remove()); document.querySelectorAll('.n-on').forEach(n=>n.classList.remove('n-on'));
  list.forEach(id => { const el = document.querySelector(`[data-n="${id}"]`); if(!el) return; if(getComputedStyle(el).position==='static') el.style.position='relative'; el.classList.add('n-on'); const m = document.createElement('span'); m.className='nmark'; m.textContent = id.replace(/[a-z]$/,''); el.appendChild(m); });
}
window.JC = { clearToast:()=>{ ui.toast = null; paintToast(); }, get db(){ return db; }, set db(v){ db = v; }, ui, go, render, setOnline, seed, persist, startSync, ACTIONS, newDraft, showNotes:(l)=>{ ui.notes = l; applyNotes(l); }, hideNotes:()=>{ ui.notes = null; render(); } };
render();
if(db.online && db.outbox.length) scheduleSync(800);
</script>
</body>
